# ============================================
# Tax Apps - Gateway server routing
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # 許可外の Host は応答せず切断（maps.conf の $host_allowed 参照）。
    # ヘルスチェックは 127.0.0.1 で叩くため影響しない。
    if ($host_allowed = 0) {
        return 444;
    }

    limit_conn conn_limit 50;

    proxy_http_version 1.1;
    include /etc/nginx/includes/proxy_params.conf;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_buffering on;
    proxy_request_buffering on;
    # proxy temp は専用 32MB tmpfs。これを超えるレスポンスはディスクへ
    # バッファせずストリーミングし、他用途の一時領域を圧迫しない。
    proxy_max_temp_file_size 32m;

    proxy_intercept_errors on;
    # 各サービスは単一コンテナのため http_5xx の再試行は無効（同一サーバへの無駄な再送と
    # 非冪等メソッドの二重実行を避ける）。接続失敗・タイムアウトのみ自動リカバリ対象。
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 15s;

    # Hashed Next.js static assets can be cached aggressively.（ポータル）
    location ~* ^/_next/static/.*$ {
        proxy_pass http://$portal_backend;
        proxy_cache static_cache;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # ゲートウェイ側 TTL は proxy_cache_path の inactive=30d を超えても
        # 到達しないため 30d に揃える（ブラウザ側は upstream の指定に従う）。
        proxy_cache_valid 200 30d;
        # Cache-Control は上書きせず upstream の指定をそのまま通す。
        # 本番(standalone build)はハッシュ済みで immutable を返すためブラウザ側も
        # 恒久キャッシュされ、開発(Turbopack)は no-cache を返すため毎回再取得になる。
        # 以前はここで immutable に上書きしていたが、開発時に古い JS が 1 年
        # ブラウザキャッシュされ、変更が反映されない原因になっていた。
        # proxy_hide_header はこのレベルに1つでもあると proxy_params.conf 側の
        # 指定が全て無効になるため、あちらの4行もここに再掲する。
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        include /etc/nginx/includes/security_headers.conf;
        access_log off;

        # JS/CSS を求めてきた相手に HTML を返さない（理由は下の2つの named location）。
        error_page 404 = @next_static_missing;
        error_page 500 502 503 504 = @next_static_unavailable;
    }

    # basePath 付き Next.js アプリのハッシュ済み静的アセット。
    # location /itcm/ 等（prefix）より正規表現が優先されるため、この位置で捕まえる。
    # アプリ名を第1セグメントから取り、アドレスは upstreams.conf の
    # $app_backend レジストリで解決する（ここにホスト名:ポートは書かない）。
    location ~* ^/(?<app_name>itcm|insurance|private-banking)/_next/static/ {
        proxy_pass http://$app_backend;
        proxy_cache static_cache;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 30d;
        # Cache-Control は上書きせず upstream の指定をそのまま通す。
        # 本番(standalone build)はハッシュ済みで immutable を返すためブラウザ側も
        # 恒久キャッシュされ、開発(Turbopack)は no-cache を返すため毎回再取得になる。
        # 以前はここで immutable に上書きしていたが、開発時に古い JS が 1 年
        # ブラウザキャッシュされ、変更が反映されない原因になっていた。
        # proxy_hide_header はこのレベルに1つでもあると proxy_params.conf 側の
        # 指定が全て無効になるため、あちらの4行もここに再掲する。
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        include /etc/nginx/includes/security_headers.conf;
        access_log off;

        # JS/CSS を求めてきた相手に HTML を返さない（理由は下の2つの named location）。
        error_page 404 = @next_static_missing;
        error_page 500 502 503 504 = @next_static_unavailable;
    }

    # _next/static が取れなかったとき・そもそも無いときの応答。
    #
    # 2026-10-13、private-banking の画面が毎秒4回リロードし続ける状態になった。
    # コンテナを作り直している最中は upstream へ繋がらず 502 になり、サーバレベルの
    # error_page は HTML(50x.html) を返すので、コンソールには
    # "Refused to execute script (MIME type text/html)" が並んでいた。そして一度
    # レンダリングに失敗した画面は、Next の dev クライアントが以降の変更通知を
    # ソフト更新ではなく location.reload() で処理する（hot-reloader-app.js の
    # SERVER_COMPONENT_CHANGES は hadRuntimeError または id="__next_error__" の
    # とき完全リロード）ため、リロードしても同じ失敗が再現して抜け出せない。
    #
    # ただし ここで HTML をやめてもループは止まらない。ブラウザは 2xx でない応答の
    # 本文を <script>/<link> として実行しないので、502 でも 503 でもチャンクは読めず
    # 画面は壊れる（＝ hadRuntimeError は同じように立つ）。ループを見つけるのは
    # manage.sh loop-check の役目で、ここで直すのは
    # 「JS/CSS を求めてきた相手に HTML を渡さない」ことだけ:
    #   - 状態コードを無視して本文を読む側（ソースマップ、fetch 経由の取得）が
    #     HTML を解析して別のエラーに化けるのを防ぐ
    #   - 落ち方が5経路で揃うので、次に調べるときに迷わない
    #     （ポータルだけ Next 自身の 404 ページ 9.4KB を返していた）
    #
    # 状態コードは変換しない（404 を 503 と書くと「upstream が落ちている」と嘘に
    # なる）。return に本文を付けると親の error_page は再び効かない。no-store なので
    # 復旧後に古い応答がキャッシュから出てくることもない。
    location @next_static_unavailable {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/includes/security_headers.conf;
        return 503 "/* tax-apps-gateway: upstream unavailable */";
    }

    # チャンクが本当に無いとき（作り直しの前に開いていたタブが古いハッシュを
    # 要求し続ける場合など）。upstream が返す 404 を差し替えるので
    # proxy_intercept_errors が要るが、これは server レベルで on になっている。
    location @next_static_missing {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/includes/security_headers.conf;
        return 404 "/* tax-apps-gateway: chunk not found */";
    }

    # Next.js font route used by Turbopack development mode.
    # 本番（standalone build）では使われない dev 専用ルート。
    location /__nextjs_font/ {
        include /etc/nginx/includes/rate_limit_general.conf;

        proxy_pass http://$nextjs_font_backend;
    }

    # Liveness: only checks that Nginx can serve requests.
    location = /health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        # この location に add_header がある時点で http レベルの add_header は
        # 全て無効化されるため、security_headers を再 include する。
        include /etc/nginx/includes/security_headers.conf;
        return 200 'OK';
    }

    # Readiness: checks that the default portal upstream is reachable.
    location = /ready {
        access_log off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
        proxy_intercept_errors off;
        proxy_pass http://$portal_backend/health;
    }

    # 完全一致にしているのは、下の「単一セグメント」正規表現 location に
    # 横取りされないようにするため（正規表現は前方一致より優先される）。
    location = /nginx-status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    # 一時リンク: fleet-board（tax_apps 外の別プロジェクト、ポート 3035）へ、
    # ポータルを開いたホスト名のまま転送する。localhost で開けば localhost:3035、
    # LAN の IP で開けばその IP:3035 になる。ポータルのカードと一緒に消す。
    # 完全一致にしているのは、上と同じく単一セグメントの正規表現に横取りされないため。
    location = /fleet-board {
        return 302 $scheme://$host:3035/;
    }
    location = /fleet-board/ {
        return 302 $scheme://$host:3035/;
    }

    # Allow Vite dev optimized dependency chunks under node_modules/.vite/.
    location ~ /\.(?!well-known(?:/|$)|vite(?:/|$)) {
        access_log off;
        return 404;
    }

    # 単一セグメントのパス（例: /itcm, /insurance, /about）をここで処理する。
    #
    #   - upstreams.conf のレジストリに登録済みのアプリ名なら
    #     末尾スラッシュへ 301（これが無いと location /xxx/ にマッチせず
    #     location / = ポータルに落ちて 404 になる）
    #   - それ以外はポータルへ素通し
    #
    # アプリ名を列挙せずレジストリ登録の有無で判定するため、アプリ追加時に
    # ここを修正する必要はない。
    #
    # 注意: この正規表現は前方一致 location より優先される。単一セグメントで
    # 個別処理したいパス（/health, /ready, /nginx-status, 旧URL互換など）は
    # すべて `location =` の完全一致で定義してあるため横取りされない。
    location ~ ^/(?<app_name>[a-z0-9][a-z0-9-]*)$ {
        include /etc/nginx/includes/rate_limit_general.conf;

        if ($app_backend) {
            return 301 $uri/$is_args$args;
        }

        # 未登録 = ポータルのページ。$app_backend は上の if で評価済み
        # （map の値はリクエスト内でキャッシュされる）ため再利用できず、
        # ポータル専用の $portal_backend を使う。
        proxy_pass http://$portal_backend;
    }

    # Portal
    location / {
        include /etc/nginx/includes/rate_limit_general.conf;

        proxy_pass http://$portal_backend;
    }

    # ------------------------------------------------------------------
    # Vite SPA アプリ（設定が同一のものをまとめて処理）
    # ここに並ぶのは「振る舞いクラス」としてのアプリ名のみ。アドレスは
    # upstreams.conf の $app_backend レジストリで解決する。
    # read_timeout 86400 は dev モードの HMR (WebSocket) を切らないため。
    #
    # 注意: 正規表現 location は前方一致 location より優先されるため、
    # 個別扱いが必要なパス（例: /inheritance-tax-docs/api/）は `^~` を
    # 付けてこの正規表現より前に確定させること。
    # ------------------------------------------------------------------
    location ^~ /inheritance-tax-app/api/ {
        include /etc/nginx/includes/rate_limit_api.conf;

        set $app_name inheritance-tax-app;
        proxy_pass http://$app_backend;
        proxy_intercept_errors off;
    }

    # svf は下の一括 location に含まれるが、API を持つのはこの一覧でここだけ。
    # 一括側は `proxy_intercept_errors off` を持たないため、これが無いと
    # Hono が返す 404/503 の JSON が 404.html / 503.html に差し替わり、
    # 「指定された年分は登録されていません」のような個別メッセージが消える。
    location ^~ /stock-valuation-form/api/ {
        include /etc/nginx/includes/rate_limit_api.conf;

        set $app_name stock-valuation-form;
        proxy_pass http://$app_backend;
        proxy_intercept_errors off;
    }

    # 銀行分析。理由は svf と同じで、API の JSON エラーを HTML のエラーページへ
    # 差し替えさせない。取引 CSV のアップロードもここを通るので、上限と直送は
    # Django 版から引き継いだ値（CSV の解析と分類に時間がかかる）。
    location ^~ /bank-analyzer/api/ {
        include /etc/nginx/includes/rate_limit_api.conf;

        set $app_name bank-analyzer;
        proxy_pass http://$app_backend;
        proxy_intercept_errors off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;
        proxy_request_buffering off;
    }

    location ~ ^/(?<app_name>tax-docs|gift-tax-simulator|inheritance-tax-docs|inheritance-tax-app|inheritance-tax-form|retirement-tax-calc|stock-valuation-form|depreciation-calc|asset-valuation|capital-gains-calc|bank-analyzer|staff-directory)/ {
        include /etc/nginx/includes/rate_limit_general.conf;

        proxy_pass http://$app_backend;
        proxy_read_timeout 86400;
    }

    # Inheritance case management (Next.js)
    location = /itcm {
        include /etc/nginx/includes/rate_limit_general.conf;

        set $app_name itcm;
        proxy_pass http://$app_backend;
    }

    location /itcm/api-v1/ {
        include /etc/nginx/includes/rate_limit_api.conf;

        set $app_name itcm;
        rewrite ^/itcm/api-v1(.+?)/?$ /itcm/api$1 break;
        proxy_pass http://$app_backend;
        proxy_intercept_errors off;
    }

    location /itcm/api/ {
        include /etc/nginx/includes/rate_limit_api.conf;

        set $app_name itcm;
        rewrite ^(.+)/$ $1 break;
        proxy_pass http://$app_backend;
        proxy_intercept_errors off;
    }

    location /itcm/ {
        include /etc/nginx/includes/rate_limit_general.conf;

        set $app_name itcm;
        proxy_pass http://$app_backend;
    }

    # Insurance management (Next.js)
    location /insurance/api/ {
        include /etc/nginx/includes/rate_limit_api.conf;

        set $app_name insurance;
        proxy_pass http://$app_backend;
        proxy_intercept_errors off;
        # app-state のインポート/バックアップは処理が長引くことがある。
        proxy_read_timeout 120s;
    }

    location /insurance/ {
        include /etc/nginx/includes/rate_limit_general.conf;

        set $app_name insurance;
        proxy_pass http://$app_backend;
    }

    # Private banking family balance sheet (Next.js)
    # Next.js canonicalizes the basePath root without a trailing slash, so the
    # exact location prevents nginx from redirecting it back to the slash form.
    location = /private-banking {
        include /etc/nginx/includes/rate_limit_general.conf;

        set $app_name private-banking;
        proxy_pass http://$app_backend;
    }

    location /private-banking/api/ {
        include /etc/nginx/includes/rate_limit_api.conf;

        set $app_name private-banking;
        proxy_pass http://$app_backend;
        proxy_intercept_errors off;
        # positions/bulk・inheritance-export は件数次第で時間がかかる。
        proxy_read_timeout 120s;
    }

    location /private-banking/ {
        include /etc/nginx/includes/rate_limit_general.conf;

        set $app_name private-banking;
        proxy_pass http://$app_backend;
        proxy_read_timeout 60s;
    }

    # Inheritance tax docs (Vite + Express)
    # 資料ファイルのアップロード（multipart）を含むため body 上限を明示。
    # `^~` = Vite 一括処理の正規表現 location に奪われないようにする。
    location ^~ /inheritance-tax-docs/api/ {
        include /etc/nginx/includes/rate_limit_api.conf;

        set $app_name inheritance-tax-docs;
        proxy_pass http://$app_backend;
        proxy_intercept_errors off;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # 銀行分析の画面は上の Vite 一括 location が受ける（API だけ別。`rewrite` は
    # 要らない ── Django 版はアプリ側がパスの接頭辞を知らなかったので剥がしていたが、
    # React 版は vite.config.ts の base と server/app.ts の BASE_PATH で
    # /bank-analyzer/ 付きのまま受ける）。Django 版の /bank-analyzer/static/ も
    # 要らない（WhiteNoise ではなく Vite のビルド成果物を同じサーバが配る）。

    # 社員台帳 (Vite + Express)。画面は上の Vite 一括 location が受ける。
    # 他アプリのサーバもここ（またはコンテナ間で直接 staff-directory:3031）を読む。
    location ^~ /staff-directory/api/ {
        include /etc/nginx/includes/rate_limit_api.conf;

        set $app_name staff-directory;
        proxy_pass http://$app_backend;
        proxy_intercept_errors off;
    }

    # 旧URL互換。スラッシュ無しも直接飛ばす（正規化 301 を挟まず 1 ホップにする）。
    location = /gift-tax-docs {
        return 301 /tax-docs/;
    }

    location /gift-tax-docs/ {
        return 301 /tax-docs/;
    }

    location = /real-estate-tax {
        return 301 /gift-tax-simulator/real-estate;
    }

    location /real-estate-tax/ {
        return 301 /gift-tax-simulator/real-estate;
    }

    location = /error-common.css {
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/includes/security_headers.conf;
    }

    error_page 500 502 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 503 /503.html;
    location = /503.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 429 /429.html;
    location = /429.html {
        root /usr/share/nginx/html;
        add_header Retry-After "30" always;
        include /etc/nginx/includes/security_headers.conf;
        internal;
    }
}
