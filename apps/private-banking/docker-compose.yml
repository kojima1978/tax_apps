# unhealthy になったときに docker-watchdog.ps1（ホスト側の定期タスク）が
# 再起動する対象であることを示す。他アプリと同じキーを使うこと。
x-autoheal-labels: &autoheal-labels
  tax-apps.autoheal: "true"

# コンテナ内で setuid ビット経由の特権取得を塞ぐ。アプリ側にその必要は無い。
# 本番用の docker-compose.prod.yml 側にだけ書かれていたので、dev で動かしている間と
# postgres 側は素通しだった。base に移して両モード・両サービスへ効かせる。
# postgres の公式イメージは root で起動してから su-exec で postgres へ降りるが、
# それは setuid ビットではなく root 権限での setuid() なのでこの設定と両立する
# （使い捨てコンテナで実際に起動確認済み）。
x-security-opts: &security-opts
  security_opt:
    - no-new-privileges:true

services:
  private-banking-postgres:
    image: postgres:16-alpine
    container_name: private-banking-postgres
    restart: unless-stopped
    labels: *autoheal-labels
    <<: *security-opts
    environment:
      TZ: Asia/Tokyo
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pb_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-private_banking}
    volumes:
      - private_banking_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-3026}:5432"
    networks:
      - tax-apps-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-private_banking}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 他アプリの postgres と同じ枠。上限が無いと、この1コンテナだけ
    # ホストの物理メモリ全量（約15.5GB）を使える状態だった。
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  private-banking-web:
    build:
      context: .
      target: dev
    container_name: private-banking-app
    restart: unless-stopped
    labels: *autoheal-labels
    <<: *security-opts
    environment:
      NODE_ENV: development
      TZ: Asia/Tokyo
      # 下の memory 上限とセットで指定する。V8 の既定ヒープ上限はホストの物理メモリ
      # （このマシンでは約15.5GB）から決まるため、コンテナ側にだけ上限を掛けると
      # 「GC が走る前に cgroup の上限に当たって OOM kill」になりうる。
      # itcm-web も同じ理由で同じ組み合わせにしてある。
      NODE_OPTIONS: "--max-old-space-size=1536"
      # compose watch の sync は Docker デーモンがオーバーレイの上位層へ直接書くため、
      # コンテナ内の inotify にイベントが届かない。Next の dev サーバはルート表を
      # watchpack の監視結果から作る（setup-dev-bundler.js の knownFiles）ので、
      # これが無いと同期されたファイルが増えてもルートとして登録されない。
      # Turbopack 側の再コンパイルは別ノブで、next.config.ts の
      # watchOptions.pollIntervalMs が担当する。両方必要。
      WATCHPACK_POLLING: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pb_dev_password}@private-banking-postgres:5432/${POSTGRES_DB:-private_banking}?schema=public
      INHERITANCE_TAX_API_URL: ${INHERITANCE_TAX_API_URL:-http://inheritance-tax-app:3004/inheritance-tax-app/api/calculate}
      INHERITANCE_TAX_API_KEY: ${INHERITANCE_TAX_API_KEY:-}
    volumes:
      - private_banking_next:/app/.next
    # ソースは bind mount せずイメージ同梱物を使い、変更は compose watch で同期する。
    #
    # 理由: Docker Desktop for Windows の bind mount(Windows→WSL2)は起動直後の
    # scandir が EFAULT を返すことがある。Next.js の dev サーバはルート表を
    # watchpack の初期スキャン結果から組み立てるため(setup-dev-bundler.js)、
    # スキャンに失敗したディレクトリ配下のルートが警告1行だけ残して丸ごと欠落し、
    # 「✓ Ready なのに 404」という状態のまま稼働し続ける。
    # コンテナ内から bind mount を無くせばこの経路自体が消え、inotify も正常に効く。
    #
    # ホットリロードを使うときは `docker/scripts/manage.sh watch private-banking`
    # をフォアグラウンドで起動しておく（--watch は --detach と併用できない）。
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        # schema 変更は Prisma Client の再生成が要るのでビルドからやり直す。
        - action: rebuild
          path: ./prisma
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./next.config.ts
    ports:
      - "127.0.0.1:3025:3025"
    networks:
      - tax-apps-network
    depends_on:
      private-banking-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3025/private-banking/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 同じ Next.js dev + Turbopack の itcm-web と同じ枠。実測は 0.9GB 前後。
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

networks:
  tax-apps-network:
    external: true

volumes:
  private_banking_postgres:
  private_banking_next:
