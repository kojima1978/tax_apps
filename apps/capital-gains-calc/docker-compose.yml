# ============================================
# 譲渡所得税 計算ツール - Docker Compose
# ============================================
# Usage:
#   開発:   docker compose up -d
#   再ビルド: docker compose up -d --build
#   ログ:   docker compose logs -f
#   停止:   docker compose down
# ============================================

# 共通設定
x-common-env: &common-env
  TZ: Asia/Tokyo

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-autoheal-labels: &autoheal-labels
  tax-apps.autoheal: "true"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 120s

# コンテナ内で setuid ビット経由の特権取得を塞ぐ。アプリ側にその必要は無い。
# bank-analyzer とゲートウェイには元から入っていた設定で、他が欠けていたのは
# 判断の結果ではなく単なる付け忘れ。
x-security-opts: &security-opts
  security_opt:
    - no-new-privileges:true

services:
  # ===========================================
  # 譲渡所得税 計算ツール
  # Port: 3019
  #
  # 機能:
  #   - 不動産（土地・建物）の譲渡所得税（分離課税）
  #     長期/短期の自動判定、建物の減価償却、概算取得費5%
  #     居住用財産3,000万円特別控除、10年超軽減税率、取得費加算
  #   - 株式等の譲渡所得税（一律20.315%）
  #   - 印刷対応
  # ===========================================
  capital-gains-calc:
    build:
      context: .
      dockerfile: ../../docker/Dockerfile.vite-static
      target: dev
      args:
        APP_PORT: "3019"
        APP_PATH: capital-gains-calc
        APP_TITLE: "Capital Gains Tax Calculator"
        APP_DESCRIPTION: "譲渡所得税 計算ツール"
        NPM_CACHE_ID: npm-store-capital-gains-calc
    container_name: capital-gains-calc
    networks:
      - tax-apps-network
    ports:
      - "127.0.0.1:3019:3019"
    volumes:
      - ./src:/app/src:ro
      - ./index.html:/app/index.html:ro
    environment:
      <<: *common-env
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=384"
    init: true
    restart: unless-stopped
    logging: *default-logging
    labels: *autoheal-labels
    <<: *security-opts
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3019/capital-gains-calc/ || exit 1"]
      <<: *healthcheck-defaults
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ===========================================
  # テスト用の使い捨てサービス（manage.sh test が run --rm で起動する）
  #
  # いまは dev で動いているが、本番モード（nginx）へ切り替えると稼働中のコンテナには
  # vitest も tsc も無くなる。モードに関係なく同じ経路で回るよう、dev ステージを
  # 別のイメージとして作る（稼働中のコンテナも作り直さずに済む）。
  # .dockerignore がテストファイルをイメージから外しているので、src はホストのものを
  # 読み取り専用で被せる。image: を明示するのは、本体と同じ自動命名のタグを共有させないため
  # （共有すると次の apply / recover が本番コンテナを dev イメージで作り直す）。
  # ===========================================
  capital-gains-calc-test:
    build:
      context: .
      dockerfile: ../../docker/Dockerfile.vite-static
      target: dev
      args:
        APP_PORT: "3019"
        APP_PATH: capital-gains-calc
        APP_TITLE: "Capital Gains Tax Calculator"
        APP_DESCRIPTION: "譲渡所得税 計算ツール"
        NPM_CACHE_ID: npm-store-capital-gains-calc
    image: capital-gains-calc-test
    profiles: ["test"]
    volumes:
      - ./src:/app/src:ro
    environment:
      <<: *common-env
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=384"
    init: true
    restart: "no"
    logging: *default-logging
    <<: *security-opts
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

networks:
  tax-apps-network:
    external: true
