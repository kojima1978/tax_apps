# ============================================
# 相続税シミュレーター - Production Override
# ============================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# ============================================

services:
  inheritance-tax-app:
    build:
      target: runner
    environment:
      NODE_ENV: production
    init: false
    # `volumes: []` はマージされて base の開発用バインドが残るため !reset で無効化する
    volumes: !reset []
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
