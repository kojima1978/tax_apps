# ============================================
# 保険管理アプリ - Docker Compose
# ============================================
# Usage:
#   開発:     docker compose up -d
#   再ビルド: docker compose up -d --build
#   ログ:     docker compose logs -f
#   停止:     docker compose down
# ============================================

x-common-env: &common-env
  TZ: Asia/Tokyo

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-autoheal-labels: &autoheal-labels
  tax-apps.autoheal: "true"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 120s

# コンテナ内で setuid ビット経由の特権取得を塞ぐ。アプリ側にその必要は無い。
# bank-analyzer とゲートウェイには元から入っていた設定で、他が欠けていたのは
# 判断の結果ではなく単なる付け忘れ。
x-security-opts: &security-opts
  security_opt:
    - no-new-privileges:true

services:
  # ===========================================
  # 保険管理アプリ
  # Port: 3030
  # ===========================================
  insurance-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_PORT: "3030"
    container_name: insurance-app
    networks:
      - tax-apps-network
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - ./app:/app/app:ro
      - ./components:/app/components:ro
      - ./lib:/app/lib:ro
      - ./services:/app/services:ro
      - ./validators:/app/validators:ro
      - ./utils:/app/utils:ro
      - insurance_data:/app/data
      - ./public:/app/public:ro
      - ./types.ts:/app/types.ts:ro
    environment:
      <<: *common-env
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=1024"
      DATABASE_PATH: "/app/data/insurance.sqlite"
    init: true
    restart: unless-stopped
    logging: *default-logging
    labels: *autoheal-labels
    <<: *security-opts
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3030/insurance/api/health || exit 1"]
      <<: *healthcheck-defaults
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M

  # ===========================================
  # テスト用の使い捨てサービス（manage.sh test が run --rm で起動する）
  #
  # 本番モードで動かすので、稼働中のコンテナには vitest も tsc も無い。
  # dev ステージを別のイメージとして作り、ボリュームは付けない
  # （テストは一時ディレクトリの SQLite を使い、本物の DB には触らない）。
  # image: を明示するのは、本体と同じ自動命名のタグを共有させないため
  # （共有すると次の apply / recover が本番コンテナを dev イメージで作り直す）。
  # ===========================================
  insurance-app-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_PORT: "3030"
    image: insurance-app-test
    profiles: ["test"]
    environment:
      <<: *common-env
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=1024"
    init: true
    restart: "no"
    logging: *default-logging
    <<: *security-opts
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M

networks:
  tax-apps-network:
    external: true

volumes:
  insurance_data:
    name: insurance-app-data
