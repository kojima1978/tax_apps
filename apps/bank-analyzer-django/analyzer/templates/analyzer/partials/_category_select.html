<select name="{{ name_prefix }}{{ tx.id }}" class="form-select form-select-sm"
    data-last-saved="{{ tx.category }}" aria-label="{{ tx.date|date:'Y年n月j日' }}の取引分類">
    {% for cat in categories %}
    <option value="{{ cat }}" {% if tx.category == cat %}selected{% endif %}>{{ cat }}</option>
    {% endfor %}
</select>
