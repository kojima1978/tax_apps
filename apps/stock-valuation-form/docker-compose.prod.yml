# ============================================
# 取引相場のない株式の評価明細書 - Production Override
# ============================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# ============================================

# 以前は nginx で静的配信するだけだったので 64M で足りていたが、
# API（Node + Prisma）を同居させたため引き上げている。
x-prod-deploy: &prod-deploy
  resources:
    limits:
      memory: 384M
    reservations:
      memory: 96M

# base の既定値（svf_dev_password）は開発専用。`.env` を置き忘れたまま本番起動すると
# 既定パスワードのまま動いてしまうので、本番では未設定なら起動を失敗させる。
x-prod-password: &prod-password ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}

services:
  svf-postgres:
    environment:
      POSTGRES_PASSWORD: *prod-password

  stock-valuation-form:
    build:
      target: runner
    environment:
      TZ: Asia/Tokyo
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=256"
      # 本番は Node が dist と API の両方を 3014 で配信する（Vite は動かない）。
      PORT: "3014"
      POSTGRES_PASSWORD: *prod-password
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}@svf-postgres:5432/${POSTGRES_DB:-stock_valuation}?schema=public
    command: ["node", "dist-server/index.js"]
    init: false
    # `volumes:` は既定でマージされ base の開発用バインドが残ってしまう。`!reset` は
    # 中身を書いても空にされるタグなので、置き換えたいここでは `!override` を使う。
    # ソースのバインドは落としたまま（本番のコードはイメージ同梱）、業種目データが
    # ホストと行き来する経路だけ開ける。
    volumes: !override
      # 業種目データの原本（Git 管理下）。開けておかないと industry:save の書き戻しが
      # コンテナの中だけで消え、industry:reseed と起動時シードはイメージへ焼き込まれた
      # ビルド当時の原本を読む。どちらも成功したように見えるので気づけない。
      - ./prisma/industry-data:/app/prisma/industry-data
      # industry:export の書き出しを手元で受け取るための唯一の経路。
      - ./output:/app/output
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget --no-verbose --tries=1 --spider http://127.0.0.1:3014/stock-valuation-form/api/health || exit 1"
      start_period: 30s
    deploy: *prod-deploy
